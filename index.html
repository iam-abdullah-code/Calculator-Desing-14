<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Educational Student Practice Project Only -->
    <title>Calculater Ui</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 20px;
        background: linear-gradient(135deg, #111827, #312e81);
        font-family: Arial, sans-serif;
      }

      .calculator {
        width: min(100%, 360px);
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(12px);
      }

      input {
        width: 100%;
        height: 72px;
        padding: 12px 16px;
        border: none;
        border-radius: 14px;
        outline: none;
        background: #f8fafc;
        color: #172033;
        font-size: 32px;
        text-align: right;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        width: min(100%, 360px);
      }

      button {
        height: 62px;
        border: none;
        border-radius: 16px;
        background: #fcfcfd;
        color: #172033;
        cursor: pointer;
        font-size: 24px;
        font-weight: 700;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      button:hover {
        background: #ffffff;
        transform: translateY(-2px);
      }

      button:active {
        transform: scale(0.95);
      }

      .clear {
        background: #fb7185;
        color: #ffffff;
      }

      .operator {
        background: #a78bfa;
        color: #ffffff;
      }

      @media (max-width: 400px) {
        body {
          padding: 12px;
        }

        .calculator {
          padding: 14px;
        }

        .row {
          gap: 8px;
        }

        button {
          height: 56px;
        }
      }
    </style>
  </head>

  <body>
    <div class="calculator">
      <input type="text" />
    </div>
    <div class="row">
      <button class="clear">C</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>
    </div>
    <div class="row">
      <button class="operator">/</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
    </div>
    <div class="row">
      <button class="operator">*</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
    </div>

    <div class="row">
      <button class="operator">-</button>
      <button>0</button>
      <button>.</button>
      <button class="operator">+</button>
    </div>
  </body>
</html>
